name: proseq2.0-nf
channels:
  - conda-forge
  - bioconda
  - defaults
# Pipeline env for real `-profile conda` runs — modern, fast-solving versions.
# The concordance TEST env (test/environment.yml) stays frozen at the original
# tool versions, so validation of the port vs proseq2.0.bsh is unaffected.
dependencies:
  - cutadapt=4.9
  - seqtk=1.4
  - prinseq=0.20.4        # provides prinseq-lite.pl
  - bwa=0.7.18
  - samtools=1.21
  - bedtools=2.31.1
  - bedops=2.4.41         # provides sort-bed
  - ucsc-bedgraphtobigwig # unpinned (bioconda per-tool versions vary)
  - fastqc=0.12.1
  - multiqc=1.21
  - rseqc=5.0.3           # infer_experiment.py for strand inference
  - sortmerna=4.3.6       # optional pre-alignment rRNA removal
  - fastp=0.23.4          # de-novo adapter detection
